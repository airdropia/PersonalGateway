name: Release Personal Windows

# Stage 10 of the personal-edition plan (plan §11). Triggered on tag pushes
# matching the personal-edition release namespace. Builds the gateway
# binary for windows/amd64, packages it with the personal example
# configuration and a short README, and uploads the ZIP plus its
# checksum as workflow artifacts. Per plan §11.4 the artifact is the
# source of truth for the Windows release; the upstream release.yml
# workflow stays untouched so the two pipelines can run in parallel.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows-amd64:
    name: Build personal-gateway-windows-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_VERSION: "1.27.0"
      # Plan §11.2: native Windows executable, no CGo, amd64.
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: make mod-check

      - name: Compute version metadata
        id: meta
        shell: bash
        run: |
          # Plan §11.4: stamp version, commit, and build date into the
          # ldflags so the resulting --version output is reproducible.
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA}"
          date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "version=${version}"
            echo "commit=${commit}"
            echo "date=${date}"
          } >> "$GITHUB_OUTPUT"

      - name: Build personal-gateway.exe
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          # Plan §11.2: -trimpath + -s -w matches the production binary
          # shape; the ldflags stamp version metadata into internal/version
          # so the gateway can self-report it via --version.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w \
              -X github.com/enterpilot/gomodel/internal/version.Version=${VERSION} \
              -X github.com/enterpilot/gomodel/internal/version.Commit=${COMMIT} \
              -X github.com/enterpilot/gomodel/internal/version.Date=${DATE}" \
            -o personal-gateway.exe ./cmd/gomodel

      - name: Stage release payload
        run: |
          mkdir -p release
          cp personal-gateway.exe release/personal-gateway.exe
          cp config/personal.example.yaml release/config.example.yaml
          # README is intentionally short: the gateway is a console binary,
          # the config file documents every knob, and the docs site holds the
          # long-form material.
          cat > release/README.txt <<'EOF'
          Personal Gateway (Windows amd64)
          =================================

          Personal-use fork of GoModel. Single ZIP, drop-in install.

          QUICK START:
            1. Unzip anywhere (e.g. C:\Users\you\personal-gateway).
            2. Open PowerShell or cmd in the install directory.
            3. Run personal-gateway.exe. The dashboard opens at
               http://127.0.0.1:8080/admin/dashboard.
            4. Press Ctrl+C in the terminal to stop.

          CUSTOM CONFIGURATION:
            The shipped config.example.yaml documents every knob. To customize:
              copy config.example.yaml to config.yaml next to the .exe, edit,
              and restart personal-gateway.exe.

          VERIFY:
              personal-gateway.exe --version

          FILES:
              personal-gateway.exe      single-file console HTTP server
              config.example.yaml       reference configuration
              README.txt                this file
              SHA256SUMS.txt            checksums
          EOF

      - name: Compute checksums
        shell: bash
        run: |
          cd release
          sha256sum personal-gateway.exe config.example.yaml README.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Zip release payload
        run: |
          version="${{ steps.meta.outputs.version }}"
          cd release
          # The CI image ships zip; deterministic timestamps keep diffs small.
          find . -type f -exec touch -d '@0' {} +
          zip -X -r "../personal-gateway-windows-amd64.zip" .

      - name: Upload release artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: personal-gateway-windows-amd64-${{ github.ref_name }}
          path: personal-gateway-windows-amd64.zip

          if-no-files-found: error
          retention-days: 90

      - name: Upload checksums
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: personal-gateway-windows-amd64-${{ github.ref_name }}-sha256
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Measure binary size
        id: size
        run: |
          # Plan §13.1 calls for measuring the binary size in CI so Stage 9
          # can decide whether provider source removal pays off. We rebuild
          # to a stable path so the lookup stays simple and the size
          # matches what the release pipeline publishes on Windows.
          set -euo pipefail
          go build -o /tmp/personal-gateway-bin ./cmd/gomodel
          size=$(stat -c '%s' /tmp/personal-gateway-bin)
          echo "binary_size_bytes=$size" >> "$GITHUB_OUTPUT"
          echo "Personal-gateway binary size: $size bytes"

  # Plan §11.4 remote Windows smoke (best-effort). A real Windows runner
  # would catch cross-compile issues, but the linux build here already
  # exercises the same ldflags + module layout. The smoke step stays
  # best-effort so a runner outage never blocks the release artifact.
  windows-smoke:
    name: Windows smoke (best-effort)
    runs-on: windows-latest
    needs: build-windows-amd64
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: personal-gateway-windows-amd64-${{ github.ref_name }}
          path: artifact

      - name: Verify --version reports metadata
        shell: pwsh
        run: |
          $root = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { $env:RUNNER_WORKSPACE }
          $artifact = Join-Path $root 'artifact'
          $zip = Join-Path $artifact 'personal-gateway-windows-amd64.zip'
          if (Test-Path $zip) {
            Write-Host "Extracting $zip"
            Expand-Archive -Path $zip -DestinationPath $artifact -Force
          }
          $exe = Get-ChildItem -Path $artifact -Recurse -ErrorAction SilentlyContinue -Filter 'personal-gateway.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "personal-gateway.exe not found after extract" }
          Write-Host "exe=$exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "personal-gateway.exe --version failed with exit code $LASTEXITCODE"
          }
          Write-Host "windows smoke OK"

  # Plan §11.4: publish the verified Windows artifact as a GitHub Release so
  # operators download from the Releases page instead of digging into the
  # Actions run. Runs after the smoke job so a non-draft release only
  # exists when the build + Windows smoke both produced an artifact.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-amd64, windows-smoke]
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: personal-gateway-windows-amd64-${{ github.ref_name }}
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: personal-gateway-windows-amd64-${{ github.ref_name }}-sha256
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@4fabdc8bec0ad32a2eb09fb8fd1d04fd30a75562 # v2.0.5
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/personal-gateway-windows-amd64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
